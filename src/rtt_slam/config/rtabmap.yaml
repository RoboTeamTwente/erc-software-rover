/rtabmap:
  rgbd_odometry:
    ros__parameters:
      # assume that the rover is stationary,
      # use the first IMU sample to set initial pose
      wait_imu_to_init: true

      # the EKF publishes odom -> base_link, so rgbd_odometry must not
      publish_tf: false

      # recover by itself after 15 consecutive frames without odometry
      # (default 0 = stay lost until reset_odom is called by hand)
      Odom/ResetCountdown: "15"

  rtabmap:
    ros__parameters:
      odom_frame_id: odom

  imu_filter_madgwick: # only need since imu data from the camera is badly formatted/formated in a way rtab map didn't want 
    ros__parameters:
      use_mag: false # we don't have a magnetometer
      publish_tf: false # do not publish a map->odom frame that only contains rotation
