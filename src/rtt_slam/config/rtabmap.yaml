/rtabmap:
  rgbd_odometry:
    ros__parameters:
      # was true. The raw RealSense IMU has no orientation, so waiting for it can block
      # odometry forever. Set to true again once an IMU with orientation is wired in.
      wait_imu_to_init: false

      # the EKF publishes odom -> base_link, so rgbd_odometry must not
      publish_tf: false
      Odom/ResetCountdown: "15"   # auto-reset after 15 consecutive lost frames
      log_to_rosout_level: 2

  rtabmap:
    ros__parameters:
      # take odometry from TF (published by the EKF) instead of the odom topic
      # odom_frame_id: odom

      subscribe_odom: true    # default anyway, made explicit
      sync_queue_size: 30     # a bit more slack for matching odom to images

  imu_filter_madgwick:
    ros__parameters:
      use_mag: false # we don't have a magnetometer
      publish_tf: false # do not publish a map->odom frame that only contains rotation
