/rtabmap:
  rgbd_odometry:
    ros__parameters:
      # false while there is no IMU with orientation on the rover: with true,
      # visual odometry does not start until an IMU message arrives.
      # TODO: set to true once the Xsens publishes /imu/data, so odometry starts
      # aligned with gravity.
      wait_imu_to_init: false

      # the EKF publishes odom -> base_link, so rgbd_odometry must not
      publish_tf: false

      # recover by itself after 15 consecutive frames without odometry
      # (default 0 = stay lost until reset_odom is called by hand)
      Odom/ResetCountdown: "15"

  rtabmap:
    ros__parameters:
      # odometry comes from the EKF topic (/odometry/filtered, remapped in
      # rtabmap_launch.yaml), which carries the covariance as well as the pose.
      # Do not set odom_frame_id: that switches rtabmap to TF, which has no covariance.
      subscribe_odom: true # default, made explicit
      sync_queue_size: 30 # slack for matching EKF odometry to the images
