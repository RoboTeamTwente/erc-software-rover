global_costmap:
  global_costmap:
    ros__parameters:
      publish_frequency: 2.
      update_frequency: 5.
      plugins:
        - static_layer
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

local_costmap:
  local_costmap:
    ros__parameters:
      publish_frequency: 2.
      update_frequency: 5.
      rolling_window: true
      plugins:
        - stvl_layer
      stvl_layer:
        plugin: 'spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer'
        publish_voxel_map: true
        observation_sources: pointcloud
        pointcloud:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points
          marking: true
          clearing: true
          filter: voxel
          model_type: 0 # depth cam
          inf_is_valid: true

lifecycle_manager:
  ros__parameters:
    autostart: true

controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      critics: ['GoalDist'] # sybau bro, here's your critic
