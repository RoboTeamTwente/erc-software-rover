# vi:sw=2:ts=2:et:

launch:

  # apply this config to all nodes launched from this file
  - set_parameters_from_file:
      filename: '$(find-pkg-share rtt_slam)/config/slam.yaml'

  # camera
  - include:
      file: '$(find-pkg-share rtt_slam)/launch/camera_launch.yaml'

  # RTABMAP
  - include:
      file: '$(find-pkg-share rtt_slam)/launch/rtabmap_launch.yaml'

  # Nav2
  - include:
      file: '$(find-pkg-share rtt_slam)/launch/navigation_launch.yaml'
