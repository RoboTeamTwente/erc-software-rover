# vi:sw=2:ts=2:et:

launch:
  - group:

      # apply this config to all nodes launched from this file
      - set_parameters_from_file:
          filename: '$(find-pkg-share rtt_slam)/config/camera.yaml'

      # RealSense camera
      - include:
          file: '$(find-pkg-share realsense2_camera)/launch/rs_launch.py'
          arg:
            - name: config_file
              value: '$(find-pkg-share rtt_slam)/config/camera_realsense.yaml'
