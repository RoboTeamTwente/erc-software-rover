# vi:sw=2:ts=2:et:

launch:
  - arg:
      name: ekf_config
      description: EKF parameter file
      default: '$(find-pkg-share rtt_slam)/config/ekf.yaml'

  - arg:
      name: use_sim_time
      description: use the /clock topic instead of the system clock
      default: "false"

  - node:
      pkg: robot_localization
      exec: ekf_node
      name: ekf_filter_node
      param:
        - from: '$(var ekf_config)'
        - name: use_sim_time
          value: '$(var use_sim_time)'
