# Nav2 configuration.
#
# The global frame `map` is the ERC yard frame: origin at start point S1, +Y towards S2, Z up.
# The global costmap is built from a cost map of the yard that was computed offline from the
# organisers' 3D model (maps/mars_yard_prior.yaml, see tools/build_prior_map.py).

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]   # the default behaviour tree asks for "GridBased"
    GridBased:
      # A* on the 2D cost grid (8-connected), with path smoothing
      plugin: "nav2_smac_planner::SmacPlanner2D"
      # step cost = distance * (1 + cost_travel_multiplier * cell_cost / 252)
      # > 1 makes the planner prefer gentle terrain over the shortest route
      cost_travel_multiplier: 3.0
      # if the goal itself is not drivable (W1 and W3 sit at the foot of embankments), plan to
      # the closest drivable point within this distance [m]. Must be > 0 for that to work.
      tolerance: 0.75
      allow_unknown: false           # the whole yard is known from the prior map
      max_planning_time: 2.0
      # the waypoints have no required heading: arrive in the driving direction
      use_final_approach_orientation: true

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      # sim rover outline (wheels included), corners [x, y] from base_link. Replace for the real rover.
      footprint: "[[0.37, 0.35], [0.37, -0.35], [-0.37, -0.35], [-0.37, 0.35]]"
      publish_frequency: 1.
      update_frequency: 1.
      # false = keep the 0..100 values of the prior map as graded costs.
      # true (the default) would turn every cell into free / lethal only.
      trinary_costmap: false
      plugins:
        - prior_layer
        - inflation_layer
      prior_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /prior_map        # published once by map_server (transient local)
        map_subscribe_transient_local: true
      # Phase 3 adds rtabmap's live obstacles here as a second layer (/rtabmap/map).
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8        # must be larger than the rover's half-diagonal (0.52 m)
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom             # the smooth frame: no jumps when rtabmap corrects the map
      robot_base_frame: base_link
      footprint: "[[0.37, 0.35], [0.37, -0.35], [-0.37, -0.35], [-0.37, 0.35]]"
      publish_frequency: 2.
      update_frequency: 5.
      rolling_window: true
      plugins:
        - voxel_layer
        - inflation_layer
      # KNOWN LIMIT: the voxel layer marks every point above a fixed height (z >= 0 in odom),
      # so ground that lies higher than start point S1 shows up as an obstacle.
      # The controller therefore does not use this costmap for now (see FollowPath).
      # Phase 3 replaces this source with rtabmap's slope-aware obstacle detection.
      voxel_layer:
        plugin: 'nav2_costmap_2d::VoxelLayer'
        publish_voxel_map: true # XXX: for debugging only
        origin_z: -1.
        z_resolution: 0.2 # height of one voxel, in meters
        z_voxels: 16 # height of the map, in voxels
        observation_sources: depth_cam
        depth_cam:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points
          expected_update_rate: 1. # scream if the topic goes silent
          marking: true
          clearing: true
          max_obstacle_height: 3.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]   # the default behaviour tree asks for "FollowPath"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3      # must move this far [m] ...
      movement_time_allowance: 15.0      # ... within this time [s], else "stuck"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14           # heading at a waypoint does not matter
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 0.5 m/s: the collision monitor looks 0.5 * 1.2 = 0.6 m ahead, so on slopes steeper
      # than about 16 deg it sees rising ground and slows the rover (see collision_monitor).
      desired_linear_vel: 0.5
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 2.0          # lookahead = 0.5 * 2 = 1.0 m, inside the 0.5-1.2 m range
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      lookahead_dist: 0.8                # only used if velocity scaling is off
      # skid steer: turn on the spot when the path is more than this off the heading [rad]
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.5
      allow_reversing: false
      # slow down in tight curves and when approaching the goal
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # both off until the local costmap is slope-aware (phase 3), see local_costmap above
      use_cost_regulated_linear_velocity_scaling: false
      use_collision_detection: false
      transform_tolerance: 0.2

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.0]     # [forward m/s, sideways, turn rad/s]
    min_velocity: [-0.3, 0.0, -2.0]   # reversing is off in the controller anyway
    max_accel: [1.0, 0.0, 2.0]        # default 2.5 m/s^2 is harsh for a rover on loose ground
    max_decel: [-1.5, 0.0, -2.0]
    velocity_timeout: 1.0

# serves maps/mars_yard_prior.yaml on /prior_map. yaml_filename is set by navigation_launch.yaml.
map_server:
  ros__parameters:
    topic_name: /prior_map
    frame_id: map

lifecycle_manager_prior_map:
  ros__parameters:
    autostart: true
    node_names: ["map_server"]

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"        # URDF has no base_footprint
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0               # older sensor data -> rover is stopped
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"         # slow down so the footprint never hits an obstacle
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["depth_cam"]
    depth_cam:
      type: "pointcloud"              # no laser scanner, so use the depth point cloud
      topic: "/camera/camera/depth/color/points"
      # Heights are in base_link (sim: axle height, ground at -0.12 m). 0.05 = 0.17 m above ground.
      # Lower sees smaller rocks but brakes for slopes: a slope of angle a reaches this height
      # 0.17 / tan(a) into the slope (0.47 m at 20 deg), and the rover looks speed * 1.2 s ahead.
      min_height: 0.05
      max_height: 1.0
      enabled: True

docking_server:
  ros__parameters:
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ["simple_charging_dock"]   # required, at least one
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
