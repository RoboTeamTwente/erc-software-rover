# vi:sw=2:ts=2:et:
# Whole test bench: Gazebo rover + the unmodified rtt_slam stack.
#
# Gazebo replaces the hardware only (RealSense camera + IMU, wheel odometry).
# Everything else is rtt_slam/launch/slam_launch.yaml with rtt_slam's own config
# files, so what is tested here is what runs on the rover. Do not copy rtt_slam
# config into this package: if the sim needs a different value, the real config
# is probably what needs changing.

launch:
  - arg:
      name: rtabmap_viz
      description: set to true to launch rtabmap_viz
      default: "true"

  # Gazebo: world, rover, bridge, covariance stamper
  - include:
      file: '$(find-pkg-share rtt_gazebo_sim)/launch/sim_launch.py'

  # SLAM stack, same launch file and config as the real rover
  - include:
      file: '$(find-pkg-share rtt_slam)/launch/slam_launch.yaml'
      arg:
        - name: realsense            # Gazebo publishes the camera topics
          value: "false"
        - name: publish_camera_tf    # robot_state_publisher has the real mounting
          value: "false"
        - name: use_sim_time
          value: "true"
        - name: rtabmap_viz
          value: '$(var rtabmap_viz)'
