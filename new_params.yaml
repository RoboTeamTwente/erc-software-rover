# =========================
# LOCAL COSTMAP (STVL)
# =========================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 5.0
      height: 5.0
      resolution: 0.05
      transform_tolerance: 0.5

      plugins: ["stvl_layer", "inflation_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 15.0
        decay_model: 0
        voxel_size: 0.05

        track_unknown_space: true
        mark_threshold: 0

        observation_sources: depth_points
        depth_points:
          topic: /camera/camera/depth/color/points
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_range: 3.0
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          sensor_frame: camera_depth_optical_frame
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4
        cost_scaling_factor: 3.0


# =========================
# GLOBAL COSTMAP (RTAB-Map)
# =========================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: depth_points

        depth_points:
          topic: /camera/camera/depth/color/points
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_range: 3.0
          raytrace_range: 3.5
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 3.0


# =========================
# PLANNER SERVER
# =========================
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true


# =========================
# CONTROLLER SERVER (MINIMAL)
# =========================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0

    controller_plugins: ["FollowPath"]

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      max_vel_x: 0.3
      max_vel_theta: 1.0

      acc_lim_x: 1.5
      acc_lim_theta: 2.0


# =========================
# BEHAVIOR SERVER
# =========================
behavior_server:
  ros__parameters:
    use_sim_time: false

    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins: ["spin", "backup", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

    global_frame: map
    robot_base_frame: base_link


# =========================
# BT NAVIGATOR
# =========================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom


# =========================
# WAYPOINT FOLLOWER
# =========================
waypoint_follower:
  ros__parameters:
    use_sim_time: false


# =========================
# LIFECYCLE MANAGER
# =========================
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true

    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - global_costmap
      - local_costmap

